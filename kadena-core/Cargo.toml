[package]
name = "kadena-core"
version = "2.0.0"
authors = ["Smart Pacts"]
edition = "2021"
license = "Apache-2.0"
description = "Device-independent logic of the Kadena Ledger app: APDU state machine, JSON tokenizer, review items, transfer template."
publish = false

[dependencies]

[dev-dependencies]
blake2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanox", "nanosplus"))'] }
