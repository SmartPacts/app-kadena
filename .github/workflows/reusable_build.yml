name: Reusable build

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "compiled_app_binaries"

  zemu_tests:
    name: Functional tests (Zemu, five device models)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [standard, transactions, legacy, negative, security]
        concurrency: [2]
        include:
          # This suite drives the emulator's own API while a review is pending, so
          # it runs one device model at a time.
          - suite: review_lock
            concurrency: 1
    env:
      # API level 26 builder image (the releases for OS 1.6.x devices, up to v1.3.3).
      # Releases from v1.3.4 are built for API level 27 by Ledger's current image, as
      # in the reusable build above; the emulator image the Zemu package pins supports
      # API levels up to 26, so the suite tests this build of the same code.
      BUILDER_IMAGE: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder@sha256:036d9fd1a264a068ea20f2d0edc962ecdbf1bf5861ef75215924abd77f93bf29
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build the five release binaries with the pinned builder image
        run: |
          set -eu
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app "$BUILDER_IMAGE" bash -c '
            set -eu
            git config --global --add safe.directory "*"
            for sdk in NANOSP NANOX STAX FLEX APEX_P; do
              eval "BOLOS_SDK=\$${sdk}_SDK"
              make -C app -j2 BOLOS_SDK="$BOLOS_SDK" PRODUCTION_BUILD=1 > "/tmp/build_$sdk.log" 2>&1 || { tail -40 "/tmp/build_$sdk.log"; exit 1; }
            done'
          mkdir -p app/output
          cp app/build/nanos2/bin/app.elf app/output/app_s2.elf
          cp app/build/nanox/bin/app.elf app/output/app_x.elf
          cp app/build/stax/bin/app.elf app/output/app_stax.elf
          cp app/build/flex/bin/app.elf app/output/app_flex.elf
          cp app/build/apex_p/bin/app.elf app/output/app_apex_p.elf
          ls -l app/output/app_*.elf
          cat app/build/nanos2/bin/app.sha256

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the test suite
        working-directory: tests_zemu
        # One download at a time: yarn 1 intermittently corrupts a tarball when it
        # extracts several in parallel.
        run: yarn install --frozen-lockfile --network-concurrency 1

      - name: Run the Zemu suite (${{ matrix.suite }})
        working-directory: tests_zemu
        run: yarn clean && yarn jest "tests/${{ matrix.suite }}.test.ts" --maxConcurrency ${{ matrix.concurrency }}

      - name: Upload failing snapshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshots-tmp-${{ matrix.suite }}
          path: tests_zemu/snapshots-tmp/
          if-no-files-found: ignore
