name: Misspellings checks

# Spell check of the repository with Ledger's reusable workflow (codespell),
# pinned to the commit behind its v1 tag, as the other Ledger workflows here.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  misspell:
    name: Check misspellings
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_spell_check.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280
    with:
      # Generated or binary data: screen snapshots, test vectors, fuzz seeds,
      # lock files and the differential report (hex responses).
      skip_path: "./tests/snapshots,./kadena-core/tests/vectors,./kadena-core/fuzz/seeds,./Cargo.lock,./kadena-core/Cargo.lock,./kadena-core/fuzz/Cargo.lock,./tools/differential/report.md"
      # False positives: `ot` (object token, json.rs), Rust `statics`, the test
      # string "caf\u{e9}" and the regex `cancell?ed`.
      ignore_words_list: "ot,statics,caf,cancell"
