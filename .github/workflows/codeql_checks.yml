name: "CodeQL"

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev
    paths-ignore:
      - '.github/workflows/*.yml'
      - 'tests/*'

# C1/P2: the token is read-only unless a job below needs more.
permissions:
  contents: read

jobs:
  analyse:
    name: Call Ledger CodeQL analysis
    # Code scanning requires GitHub Advanced Security, which is a paid add-on on
    # private repositories: on the private mirror every run fails with "Advanced
    # Security must be enabled for this repository to use code scanning".
    # Runs on the public repository, where it is free and is the real gate.
    #
    # Written as `!private` rather than an explicit repo name so it fails toward
    # RUNNING: if the event payload has no repository object the expression is
    # true and the job still executes. A guard that can silently switch this off
    # in the public repo would be worse than the failure it fixes.
    if: ${{ !github.event.repository.private }}
    # The called workflow declares these; a caller granting less fails the run.
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_codeql_checks.yml@f5dd18f90efc3562ad2869fb30027bd9cd21f322 # v1
    # No secrets passed: the called workflow's only secret is an optional token for checking out
    # private repositories, and this one is public (it falls back to the job token).
