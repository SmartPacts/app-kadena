name: Lint and format 💅

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

# C1/P2: the token is read-only unless a job below needs more.
permissions:
  contents: read

jobs:
  ledger-lint:
    # The reusable lint's cpp-linter step posts its findings as pull-request comments.
    permissions:
      contents: read
      pull-requests: write
    uses: Zondax/_workflows/.github/workflows/_ledger_lint.yml@6d3659c47642b775a86636ae5bedb2da8a1e6f8c # v3
    with:
      runs-on: ${{ github.repository_owner == 'zondax' && 'zondax-runners' || 'ubuntu-latest' }}
