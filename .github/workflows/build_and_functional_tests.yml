name: Build and functional tests

# Ledger's reusable workflows, pinned to the commit behind their v1 tag
# (LedgerHQ/ledger-app-workflows db5fd3d8e4fe724ccc4617709c9e245976ee8280, 2026-09-24).
# The build uses Ledger's builder image (mandatory for store submission). The
# functional tests run on the reusable workflow's default runner, as in
# app-boilerplate-rust: the workflow installs tests/requirements.txt with pip,
# which the dev-tools image refuses (externally managed environment). Local
# runs use the pinned dev-tools image (README, "Tests").

# Read-only by default. Each job is raised to what Ledger's reusable workflow
# requests (a caller cannot grant less, or the run fails at startup); only the
# functional tests job may write to the repository.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behaviour if the test snapshots differ from the expected ones.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
  pull_request:

jobs:
  build_application:
    name: Build application using the reusable workflow
    permissions:
      contents: read
      actions: write        # upload of the build artifacts
      pull-requests: write  # requested by the reusable workflow (PR comments)
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280
    with:
      upload_app_binaries_artifact: "compiled_app_binaries"
      builder: ledger-app-builder

  ragger_tests:
    name: Functional tests (Ragger, Speculos, five devices)
    needs: build_application
    permissions:
      contents: write       # golden_run: the reusable workflow commits new snapshots
      actions: write        # upload of test artifacts
      pull-requests: write  # golden_run: the reusable workflow opens a PR with them
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280
    with:
      download_app_binaries_artifact: "compiled_app_binaries"
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
      test_dir: tests/
