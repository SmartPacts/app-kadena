name: Checks on the Python tests

# Lint (ruff, configured in ruff.toml) and type check (mypy, configured in
# tests/setup.cfg) of the Ragger tests, with Ledger's reusable workflow pinned
# to the commit behind its v1 tag.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Call Ledger Python linters
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_python_checks.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280
    with:
      run_type_check: true
      src_directory: .
      setup_directory: tests
      req_directory: tests
