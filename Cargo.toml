[package]
name = "kadena"
version = "2.0.0"
authors = ["Smart Pacts"]
edition = "2021"
license = "Apache-2.0"
description = "Kadena app for Ledger devices"

[dependencies]
ledger_device_sdk = { version = "=1.41.0", features = ["io_new", "sys"] }
# Heap measurement build only: the SDK's allocator, wrapped (see `heap-probe`).
embedded-alloc = { version = "=0.5.1", optional = true }
critical-section = { version = "1.2.0", optional = true }
kadena-core = { path = "kadena-core" }

[features]
default = ["ledger_device_sdk/nano_nbgl"]
debug = ["ledger_device_sdk/debug"]
# Heap measurement build (never shipped), made by tools/heap-probe.sh: it turns the
# SDK's own allocator off in a copy of this manifest, and the app installs the same
# allocator (embedded-alloc 0.5.1, same heap size) wrapped to record the most bytes
# ever in use; INS 0xFE answers it. This manifest keeps the SDK's default features:
# turning them off here would change the shipped binary.
heap-probe = ["dep:embedded-alloc", "dep:critical-section"]

[package.metadata.ledger]
curve = ["ed25519"]
flags = "0"
path = ["44'/626'"]
name = "Kadena"
nanox = { icon = "icons/nanox_icon.gif" }
nanosplus = { icon = "icons/nanox_icon.gif" }
stax = { icon = "icons/stax_icon.gif" }
flex = { icon = "icons/flex_icon.gif" }
apex_p = { icon = "icons/apex_p_icon.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanox", "nanosplus"))'] }
