[tool:pytest]
addopts = --strict-markers

[mypy]
python_version = 3.11
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
strict_optional = False

[mypy-ragger.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

# PyQt6 (a dependency of Ragger and Speculos) ships stubs that mypy 2.4 rejects
# as syntax errors. The tests never use it, but two typed packages import it:
# Ragger's GUI and Pillow's ImageQt. follow_imports does not apply to stub files
# (a [mypy-PyQt6.*] section has no effect), so those two modules are not followed.
[mypy-ragger.gui.*]
follow_imports = skip

[mypy-PIL.ImageQt]
follow_imports = skip
